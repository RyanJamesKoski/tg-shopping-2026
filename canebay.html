<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Cane Bay Publix List</title><style>body{font-family:-apple-system,system-ui,sans-serif;max-width:600px;margin:0 auto;padding:0 14px 60px;background:#fffaf5;color:#222}
.top{background:#c2410c;color:#fff;margin:0 -14px;padding:14px;position:sticky;top:0;z-index:9}.top b{font-size:1.1em}
h2{font-size:1.1em;margin:26px 0 2px;display:flex;justify-content:space-between;border-bottom:2px solid #c2410c;padding-bottom:4px}h2 span{color:#c2410c}
h3{font-size:.8em;text-transform:uppercase;letter-spacing:.05em;color:#c2410c;margin:16px 0 4px}.s{font-size:.8em;color:#666}
.i{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid #eee}.i input{width:22px;height:22px;flex:none;accent-color:#c2410c;margin-top:2px}
.i:has(input:checked){opacity:.4;text-decoration:line-through}.df{background:#059669;color:#fff;font-size:.7em;padding:1px 4px;border-radius:4px}a{color:#c2410c}button{margin-top:20px;padding:8px 12px}.box{background:#fff3e8;border:1px solid #fdba74;border-radius:10px;padding:10px;font-size:.85em;line-height:1.5}</style></head><body>
<div class=top><b>🟢 Publix — Cane Bay</b><br><span id=left></span></div>
<p class=s><a href="https://www.google.com/maps/dir/?api=1&destination=Publix+1724+State+Rd+Summerville+SC">1724 State Rd, Summerville SC</a> · Closed Thanksgiving<br>
Look for yellow <b>BOGO</b> tags; otherwise Publix brand is cheapest. Prices aren't posted online, so none are listed.<br><a href="./">← Thanksgiving list</a></p>
<h3>📍 Produce</h3><label class=i><input type=checkbox data-id=Pro0><span><b>Apples</b></span></label><label class=i><input type=checkbox data-id=Pro1><span><b>Bananas</b></span></label><label class=i><input type=checkbox data-id=Pro2><span><b>Tomatoes</b></span></label><label class=i><input type=checkbox data-id=Pro3><span><b>Hummus <span class=s>(refrigerated case by produce)</span></b></span></label><h3>📍 Deli / Bakery</h3><label class=i><input type=checkbox data-id=Del0><span><b>Bread</b></span></label><label class=i><input type=checkbox data-id=Del1><span><b>Cheese <span class=s>(sliced at the deli, bagged in dairy)</span></b></span></label><h3>📍 Grocery aisles</h3><label class=i><input type=checkbox data-id=Gro0><span><b>Chips</b></span></label><label class=i><input type=checkbox data-id=Gro1><span><b>Turkey bags <span class=s>(oven bags — foil &amp; wrap aisle. If you meant deli turkey, get it at the deli)</span></b></span></label>
<button onclick="if(confirm('Uncheck everything?')){localStorage.removeItem('cb');location.reload()}">Reset list</button>
<script>let c=JSON.parse(localStorage.getItem('cb')||'{}');const bs=[...document.querySelectorAll('input[data-id]')];
const up=()=>{document.getElementById('left').textContent=bs.filter(b=>!b.checked).length+' items left'};
bs.forEach(b=>{b.checked=!!c[b.dataset.id];b.onchange=()=>{c[b.dataset.id]=b.checked;localStorage.setItem('cb',JSON.stringify(c));up()}});up()</script></body></html>
